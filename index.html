<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://raw.githubusercontent.com https://github.githubassets.com; font-src 'self'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; frame-src 'none'; object-src 'none'; base-uri 'self'" />
    <title>欢迎认识杨枝甘鹿</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // SPA 路由恢复：GitHub Pages 用 404.html 兜底时把原始路径存到 sessionStorage，
      // 这里在应用启动前恢复，避免刷新后回到首页。
      (function () {
        var p = sessionStorage.getItem('spa_redirect');
        if (p && p !== '/' && location.pathname !== p) {
          history.replaceState(null, '', p);
        }
        sessionStorage.removeItem('spa_redirect');
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
